name: Install original Mind and Spirit cover
on:
  push:
    paths:
      - '.github/workflows/repair-spirit-cover.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wildwire-spirit-cover-repair
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate exclusive cinematic photograph and update current issue
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WILDWIRE_MODEL: ${{ vars.WILDWIRE_MODEL }}
          WILDWIRE_IMAGE_MODEL: ${{ vars.WILDWIRE_IMAGE_MODEL }}
        run: node scripts/repair-spirit-cover.cjs
      - name: Build and validate all edition pages
        run: |
          npm ci --no-audit --no-fund
          node scripts/build-content.cjs
          npm test
          node scripts/check-content.cjs
      - name: Publish the verified cover and article metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/generated content/articles js/spirit-feature-bridge.js js/articles-current.js js/articles.js index.html
          git commit -m "Publish exclusive cinematic Mind and Spirit cover for issue 03"
          git pull --rebase origin main
          git push origin HEAD:main
