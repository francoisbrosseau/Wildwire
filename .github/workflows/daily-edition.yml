name: WILDWIRE daily edition

on:
  push:
    branches: [main]
    paths: ['.github/publication-recovery-20261017']
  schedule:
    - cron: '17 0,2,4,5 * * *'
      timezone: America/Toronto
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and inspect a complete preview; never commit or deploy
        type: boolean
        default: true
        required: true
      test_date:
        description: Optional future Toronto date for an isolated preview (YYYY-MM-DD)
        type: string
        default: ''
        required: false
      resume_run:
        description: Optional previous preview run ID to recover validated unpublished work
        type: string
        default: ''
        required: false

permissions:
  contents: read

concurrency:
  group: wildwire-daily-edition
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      (github.event_name == 'push' && vars.WILDWIRE_AUTO_PUBLISH == 'enabled' && vars.WILDWIRE_LIVE_APPROVED == 'yes') ||
      (github.event_name == 'schedule' && vars.WILDWIRE_AUTO_PUBLISH == 'enabled' && vars.WILDWIRE_LIVE_APPROVED == 'yes') ||
      (github.event_name == 'workflow_dispatch' && (inputs.dry_run == true ||
      (inputs.dry_run == false && github.ref_name == github.event.repository.default_branch && vars.WILDWIRE_AUTO_PUBLISH == 'enabled' && vars.WILDWIRE_LIVE_APPROVED == 'yes')))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      actions: read
    timeout-minutes: 60
    outputs:
      live: ${{ steps.publish.outputs.live }}
      revision: ${{ steps.publish.outputs.revision }}
    env:
      WILDWIRE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
      WILDWIRE_TEST_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && inputs.test_date || '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Select Toronto edition date
        id: edition
        run: node -e "const e=require('./scripts/automated-publish.cjs');require('fs').appendFileSync(process.env.GITHUB_OUTPUT,'date='+e.editionDate(process.env.WILDWIRE_TEST_DATE,process.env.WILDWIRE_DRY_RUN==='true')+'\n')"
      - name: Recover validated stories and images from an earlier attempt
        uses: actions/cache/restore@v4
        with:
          path: .wildwire-runs
          key: editorial-v2-${{ github.ref_name }}-${{ steps.edition.outputs.date }}-${{ hashFiles('scripts/automated-publish.cjs') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: editorial-v2-${{ github.ref_name }}-${{ steps.edition.outputs.date }}-${{ hashFiles('scripts/automated-publish.cjs') }}-
      - name: Recover an explicitly selected previous preview
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run && inputs.resume_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RUN: ${{ inputs.resume_run }}
          EDITION_DATE: ${{ steps.edition.outputs.date }}
        run: |
          [[ "$RESUME_RUN" =~ ^[0-9]+$ ]] || { echo 'resume_run must be a numeric run ID'; exit 1; }
          gh run download "$RESUME_RUN" --repo "$GITHUB_REPOSITORY" --pattern "wildwire-edition-${EDITION_DATE}-*" --dir "$RUNNER_TEMP/recovered-edition"
          for source_dir in "$RUNNER_TEMP/recovered-edition/.wildwire-runs/$EDITION_DATE" "$RUNNER_TEMP/recovered-edition/"*/.wildwire-runs/"$EDITION_DATE"; do
            if [ -d "$source_dir" ]; then
              mkdir -p ".wildwire-runs/$EDITION_DATE"
              cp -n "$source_dir/"* ".wildwire-runs/$EDITION_DATE/"
            fi
          done
      - name: Recover the validated October 17 work for the authorized morning rescue
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(TZ=America/Toronto date +%F)" = 2026-10-17 || { echo 'Expired recovery request'; exit 1; }
          gh run download 39029584578 --repo "$GITHUB_REPOSITORY" --pattern 'wildwire-edition-2026-10-17-*' --dir "$RUNNER_TEMP/morning-recovery"
          mkdir -p .wildwire-runs/2026-10-17
          source_dir=$(find "$RUNNER_TEMP/morning-recovery" -type d -path '*/.wildwire-runs/2026-10-17' -print -quit)
          test -n "$source_dir" || { find "$RUNNER_TEMP/morning-recovery" -type f; exit 1; }
          cp --update=none "$source_dir/"* .wildwire-runs/2026-10-17/
          test -f .wildwire-runs/2026-10-17/story-0.json
      - name: Research and generate nine stories and fifteen distinct images
        id: generate
        # A rejected PREVIEW is a diagnostic result, not a production failure email.
        # Its outcome remains visible below; production failures still fail the job.
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: node scripts/automated-publish.cjs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - name: Validate the NEW edition and its homepage and archive integration
        id: validate
        if: steps.generate.outcome == 'success'
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          node scripts/check-content.cjs
          npm test
          node scripts/package-pages.cjs
      - name: Save validated work even if a later story failed
        if: always() && steps.edition.outputs.date != ''
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: .wildwire-runs
          key: editorial-v2-${{ github.ref_name }}-${{ steps.edition.outputs.date }}-${{ hashFiles('scripts/automated-publish.cjs') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Keep the preview, provenance, usage and failure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wildwire-edition-${{ steps.edition.outputs.date }}-${{ github.run_attempt }}
          path: |
            .wildwire-runs/
            dist/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
      - name: Preview result (read this before promoting)
        if: always() && github.event_name == 'workflow_dispatch' && inputs.dry_run
        env:
          GENERATED: ${{ steps.generate.outcome }}
          VALIDATED: ${{ steps.validate.outcome }}
        run: |
          if [ "$GENERATED" = success ] && [ "$VALIDATED" = success ]; then
            echo '## PREVIEW PASSED — nine new stories, fifteen new images, new-edition site tests passed. Nothing published.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## PREVIEW NEEDS ATTENTION — not approved for production. Nothing published. Inspect the failed step and attached edition report. Preview diagnostics do not send production-failure alerts.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Report a late scheduled edition without discarding validated work
        if: github.event_name == 'schedule'
        run: node -e "const p=new Intl.DateTimeFormat('en-GB',{timeZone:'America/Toronto',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date()).split(':').map(Number);if(p[0]>6||(p[0]===6&&p[1]>=40))console.log('::warning::Edition is late for the 7 a.m. target; publishing the complete validated edition now.')"
      - name: Commit the complete validated edition
        id: publish
        if: >-
          steps.generate.outcome == 'success' && steps.validate.outcome == 'success' &&
          env.WILDWIRE_DRY_RUN == 'false' && github.ref_name == github.event.repository.default_branch &&
          vars.WILDWIRE_AUTO_PUBLISH == 'enabled' && vars.WILDWIRE_LIVE_APPROVED == 'yes'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/articles content/editions images/generated js/articles.js js/articles-current.js
          if ! git diff --cached --quiet; then
            git commit -m "Publish WILDWIRE daily edition"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo 'live=true' >> "$GITHUB_OUTPUT"
      - name: Report a production failure
        if: failure() && env.WILDWIRE_DRY_RUN == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
        run: |
          title="WILDWIRE daily edition failed: $(TZ=America/Toronto date +%F)"
          count=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq length)
          if [ "$count" = 0 ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "Generation or validation failed; no candidate was committed. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi

  deploy:
    needs: publish
    if: needs.publish.outputs.live == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      revision: ${{ needs.publish.outputs.revision }}

  verify:
    needs: [publish, deploy]
    if: always() && needs.publish.outputs.live == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.publish.outputs.revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify WildWireMag.com serves the committed edition
        if: needs.deploy.result == 'success'
        run: node scripts/verify-live.cjs
      - name: Fail if Pages deployment failed
        if: needs.deploy.result != 'success'
        run: exit 1
      - name: Report a deployment or live-verification failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
        run: |
          title="WILDWIRE deployment needs attention: $(TZ=America/Toronto date +%F)"
          count=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq length)
          if [ "$count" = 0 ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "A complete edition was committed but deployment or public verification failed. Inspect Pages before deciding whether to redeploy or revert. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi
