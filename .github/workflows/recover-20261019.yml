name: Recover validated WILDWIRE October 19 edition

on:
  push:
    paths:
      - '.github/workflows/recover-20261019.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: wildwire-daily-edition
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Recover the October 19 validated generation checkpoints
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/wildwire-recovery"
          gh run download 39234411483 --repo "$GITHUB_REPOSITORY" --name wildwire-edition-2026-10-19-2 --dir "$RUNNER_TEMP/wildwire-recovery"
          source_dir="$(find "$RUNNER_TEMP/wildwire-recovery" -type f -name 'story-0.json' -path '*/2026-10-19/*' -print -quit)"
          test -n "$source_dir" || { echo "::error::No validated story checkpoint found in the October 19 artifact"; exit 1; }
          source_dir="$(dirname "$source_dir")"
          mkdir -p .wildwire-runs/2026-10-19
          cp -a "$source_dir/." .wildwire-runs/2026-10-19/
          echo "Recovered $(find .wildwire-runs/2026-10-19 -name 'story-*.json' | wc -l) story checkpoints"
      - name: Install dependencies and finalize source files
        run: |
          npm install --no-audit --no-fund
          node scripts/automated-publish.cjs
          node scripts/check-content.cjs
          npm test
          node scripts/package-pages.cjs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WILDWIRE_DRY_RUN: 'false'
      - name: Publish validated edition from the latest branch head
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/articles content/editions images/generated js/articles.js js/articles-current.js
          git diff --cached --quiet && { echo "::error::No new edition content produced"; exit 1; }
          git commit -m "Publish recovered October 19 WILDWIRE edition"
          git fetch origin main
          git reset --hard HEAD
          git rebase origin/main
          git push origin HEAD:main
      - name: Preserve diagnostic report if recovery fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wildwire-oct19-recovery-failure
          path: .wildwire-runs/2026-10-19
          retention-days: 7
          if-no-files-found: ignore
